<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Audit Sampah Web</title>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #eef5fc;
            color: #1e3a8a;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            background-color: #1d4ed8;
            color: #ffffff;
            padding: 24px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 24px;
        }

        header h1 {
            font-size: 2rem;
            margin-bottom: 8px;
        }

        header p {
            font-size: 1rem;
            opacity: 0.9;
        }

        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 24px;
        }

        @media (max-width: 768px) {
            .dashboard {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background-color: #ffffff;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(30, 58, 138, 0.08);
            border: 1px solid #bfdbfe;
        }

        .card h2 {
            font-size: 1.25rem;
            color: #1e40af;
            margin-bottom: 16px;
            border-bottom: 2px solid #dbeafe;
            padding-bottom: 8px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 0.9rem;
            color: #1e3a8a;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #93c5fd;
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus, .form-group select:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
        }

        .btn {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-size: 1rem;
            font-weight: 600;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: #1d4ed8;
        }

        .stats-summary {
            display: flex;
            justify-content: space-between;
            margin-bottom: 16px;
            background-color: #dbeafe;
            padding: 12px;
            border-radius: 8px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-item .val {
            font-size: 1.25rem;
            font-weight: bold;
            color: #1e40af;
        }

        .stat-item .lbl {
            font-size: 0.8rem;
            color: #3b82f6;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        table th, table td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
            font-size: 0.9rem;
        }

        table th {
            background-color: #eff6ff;
            color: #1e40af;
        }

        .btn-delete {
            background-color: #ef4444;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .btn-delete:hover {
            background-color: #dc2626;
        }

        .chart-container {
            position: relative;
            height: 300px;
            width: 100%;
            display: flex;
            justify-content: center;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Audit Sampah Digital</h1>
        <p>Aplikasi Pencatatan dan Analisis Kategori Sampah Harian</p>
    </header>

    <div class="dashboard">
        <!-- Form Input -->
        <div class="card">
            <h2>Tambah Data Audit</h2>
            <form id="wasteForm">
                <div class="form-group">
                    <label for="wasteName">Nama Sampah</label>
                    <input type="text" id="wasteName" placeholder="Contoh: Botol Plastik, Kulit Pisang, Kaleng Soda" required>
                </div>
                <div class="form-group">
                    <label for="category">Kategori Sampah (Lengkap)</label>
                    <select id="category" required>
                        <option value="">-- Pilih Kategori --</option>
                        <option value="Plastik keras (PET/HDPE)">Plastik keras (PET/HDPE)</option>
                        <option value="Plastik lunak/Kemasan">Plastik lunak/Kemasan</option>
                        <option value="Organik (Sisa Makanan)">Organik (Sisa Makanan)</option>
                        <option value="Organik (Taman/Ranting)">Organik (Taman/Ranting)</option>
                        <option value="Kertas & Karton">Kertas & Karton</option>
                        <option value="Kaca & Botol">Kaca & Botol</option>
                        <option value="Logam & Kaleng">Logam & Kaleng</option>
                        <option value="Elektronik (E-Waste)">Elektronik (E-Waste)</option>
                        <option value="B3 / Bahan Berbahaya">B3 / Bahan Berbahaya</option>
                        <option value="Tekstil & Pakaian">Tekstil & Pakaian</option>
                        <option value="Karet & Kulit">Karet & Kulit</option>
                        <option value="Residu / Lainnya">Residu / Lainnya</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="weight">Berat (Kg)</label>
                    <input type="number" id="weight" step="0.1" min="0.1" placeholder="Contoh: 1.5" required>
                </div>
                <div class="form-group">
                    <label for="location">Lokasi / Sumber</label>
                    <input type="text" id="location" placeholder="Contoh: Dapur, Ruang Kerja, Taman" required>
                </div>
                <button type="submit" class="btn">Simpan Data</button>
            </form>
        </div>

        <!-- Diagram / Chart -->
        <div class="card">
            <h2>Diagram Komposisi Sampah</h2>
            <div class="stats-summary">
                <div class="stat-item">
                    <div class="lbl">Total Catatan</div>
                    <div class="val" id="totalEntries">0</div>
                </div>
                <div class="stat-item">
                    <div class="lbl">Total Berat</div>
                    <div class="val" id="totalWeight">0 Kg</div>
                </div>
            </div>
            <div class="chart-container">
                <canvas id="wasteChart"></canvas>
            </div>
        </div>
    </div>

    <!-- Tabel Data Log -->
    <div class="card">
        <h2>Riwayat Audit Sampah</h2>
        <table id="wasteTable">
            <thead>
                <tr>
                    <th>Nama Sampah</th>
                    <th>Kategori</th>
                    <th>Berat (Kg)</th>
                    <th>Lokasi</th>
                    <th>Tanggal</th>
                    <th>Aksi</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- Data dimasukkan lewat JS -->
            </tbody>
        </table>
    </div>
</div>

<script>
    let wasteData = JSON.parse(localStorage.getItem('wasteData')) || [];
    let myChart = null;

    const wasteForm = document.getElementById('wasteForm');
    const tableBody = document.getElementById('tableBody');
    const totalEntriesEl = document.getElementById('totalEntries');
    const totalWeightEl = document.getElementById('totalWeight');

    // Daftar Kategori Sampah Lengkap
    const categoriesList = [
        'Plastik keras (PET/HDPE)',
        'Plastik lunak/Kemasan',
        'Organik (Sisa Makanan)',
        'Organik (Taman/Ranting)',
        'Kertas & Karton',
        'Kaca & Botol',
        'Logam & Kaleng',
        'Elektronik (E-Waste)',
        'B3 / Bahan Berbahaya',
        'Tekstil & Pakaian',
        'Karet & Kulit',
        'Residu / Lainnya'
    ];

    wasteForm.addEventListener('submit', function (e) {
        e.preventDefault();

        const name = document.getElementById('wasteName').value;
        const category = document.getElementById('category').value;
        const weight = parseFloat(document.getElementById('weight').value);
        const location = document.getElementById('location').value;
        const date = new Date().toLocaleDateString('id-ID', {
            day: 'numeric',
            month: 'short',
            year: 'numeric'
        });

        const newEntry = {
            id: Date.now(),
            name,
            category,
            weight,
            location,
            date
        };

        wasteData.push(newEntry);
        saveAndRender();
        wasteForm.reset();
    });

    function deleteEntry(id) {
        wasteData = wasteData.filter(item => item.id !== id);
        saveAndRender();
    }

    function saveAndRender() {
        localStorage.setItem('wasteData', JSON.stringify(wasteData));
        renderTable();
        renderChart();
        updateSummary();
    }

    function renderTable() {
        tableBody.innerHTML = '';

        if (wasteData.length === 0) {
            tableBody.innerHTML = '<tr><td colspan="6" style="text-align:center; color:#94a3b8;">Belum ada data audit.</td></tr>';
            return;
        }

        wasteData.slice().reverse().forEach(item => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td><strong>${item.name}</strong></td>
                <td>${item.category}</td>
                <td>${item.weight} kg</td>
                <td>${item.location}</td>
                <td>${item.date}</td>
                <td><button class="btn-delete" onclick="deleteEntry(${item.id})">Hapus</button></td>
            `;
            tableBody.appendChild(row);
        });
    }

    function updateSummary() {
        totalEntriesEl.textContent = wasteData.length;
        const totalKg = wasteData.reduce((sum, item) => sum + item.weight, 0);
        totalWeightEl.textContent = `${totalKg.toFixed(1)} Kg`;
    }

    function renderChart() {
        const totals = categoriesList.map(cat => {
            return wasteData
                .filter(item => item.category === cat)
                .reduce((sum, item) => sum + item.weight, 0);
        });

        const ctx = document.getElementById('wasteChart').getContext('2d');

        if (myChart) {
            myChart.destroy();
        }

        myChart = new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: categoriesList,
                datasets: [{
                    data: totals,
                    backgroundColor: [
                        '#2563eb', // Plastik Keras (Biru)
                        '#60a5fa', // Plastik Lunak (Biru Muda)
                        '#16a34a', // Organik Makanan (Hijau)
                        '#4ade80', // Organik Taman (Hijau Muda)
                        '#f59e0b', // Kertas (Kuning Oranye)
                        '#06b6d4', // Kaca (Sian)
                        '#64748b', // Logam (Abu-abu)
                        '#8b5cf6', // Elektronik (Ungu)
                        '#ef4444', // B3 (Merah)
                        '#ec4899', // Tekstil (Pink)
                        '#78350f', // Karet & Kulit (Cokelat)
                        '#94a3b8'  // Residu (Abu Muda)
                    ],
                    borderWidth: 2,
                    borderColor: '#ffffff'
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        position: 'right',
                        labels: {
                            boxWidth: 10,
                            font: { size: 10 }
                        }
                    }
                }
            }
        });
    }

    saveAndRender();
</script>

</body>
</html>
