<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Menampilkan Data Barang</title>
    <style>
        table {
            border-collapse: collapse;
            width: 100%;
        }
        th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: center;
        }
        th {
            background-color: #f2f2f2;
        }
        .left-align {
            text-align: left;
        }
    </style>
</head>
<body>
    <h2>Menampilkan Data Barang</h2>
    <hr>
    <table>
        <thead>
            <tr>
                <th rowspan="2">NO.</th>
                <th rowspan="2">NAMA BARANG</th>
                <th colspan="3">UKURAN</th>
                <th rowspan="2">PRODUSEN</th>
            </tr>
            <tr>
                <th>BESAR</th>
                <th>SEDANG</th>
                <th>KECIL</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td class="left-align">Air Mineral</td>
                <td>Rp.5000</td>
                <td>Rp.3000</td>
                <td>Rp.1000</td>
                <td class="left-align">PT Golden Missisipi</td>
            </tr>
            <tr>
                <td>2</td>
                <td class="left-align">Susu Ultra</td>
                <td>Rp.8000</td>
                <td>Rp.5000</td>
                <td>Rp.3000</td>
                <td class="left-align">PT Ultra Jaya</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
