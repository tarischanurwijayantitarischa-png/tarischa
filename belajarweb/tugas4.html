<!DOCTYPE html>
<html>
<head>
    <title>Formulir Pendaftaran</title>
    <style>
        body {
            background-color: #e2e7ec;
            font-family: Arial, sans-serif;
        }
        table.form-box {
            border: 2px solid #333;
            padding: 20px;
            background-color: #ffffff;
            width: 420px;
            margin: 30px auto;
        }
        h2 {
            text-align: center;
            font-family: "Times New Roman", serif;
        }
        input[type="password"] {
            background-color: #98a2ee;
        }
    </style>
</head>
<body>
<table class="form-box">
    <tr>
        <td colspan="3"><h2>Formulir Pendaftaran</h2></td>
    </tr>
    <form method="post" action="">
    <tr>
        <td>Nama</td>
        <td>:</td>
        <td><input type="text" name="nama" size="30"></td>
    </tr>
    <tr>
        <td>Password</td>
        <td>:</td>
        <td><input type="password" name="password" size="30"></td>
    </tr>
    <tr>
        <td>Tanggal Lahir</td>
        <td></td>
        <td>
            <input type="text" name="hari" size="2" maxlength="2">
            /
            <input type="text" name="bulan" size="2" maxlength="2">
            /
            <input type="text" name="tahun" size="4" maxlength="4"> (hh/bb/tttt)
        </td>
    </tr>
    <tr>
        <td>Jenis Kelamin</td>
        <td>:</td>
        <td>
            <input type="radio" name="kelamin" value="L"> Laki-Laki
            <input type="radio" name="kelamin" value="P"> Perempuan
        </td>
    </tr>
    <tr>
        <td>Jurusan</td>
        <td>:</td>
        <td>
            <select name="jurusan">
                <option value="rpl" selected>RPL</option>
                <option value="tkj">TKJ</option>
                <option value="mm">Multimedia</option>
                <option value="tg">Teknik Grafika</option>
                <option value="ph">Perhotelan</option>
                <option value="animasi">animasi</option>
                <option value="meka">mekatronika</option>
                <option value="tl">Teknik Logistik</option>
            </select>
        </td>
    </tr>
    <tr>
        <td valign="top">Hoby</td>
        <td valign="top">:</td>
        <td>
            <input type="checkbox" name="hoby1" value="football"> Football
            <input type="checkbox" name="hoby2" value="traveling"> Traveling
            <input type="checkbox" name="hoby3" value="blogging"> Blogging
            <br>
            <input type="checkbox" name="hoby4" value="music"> Music
            <input type="checkbox" name="hoby5" value="adventure"> Adventure
            <input type="checkbox" name="hoby6" value="lainnya"> Lainnya
        </td>
    </tr>
    <tr>
        <td valign="top">Alamat</td>
        <td valign="top">:</td>
        <td>
            <textarea name="alamat" cols="30" rows="5"></textarea>
        </td>
    </tr>
    <tr>
        <td colspan="3" align="center">
            <br>
            <input type="submit" name="kirim" value="Kirim">
            <input type="reset" name="reset" value="Reset">
        </td>
    </tr>
    </form>
</table>
</body>
</html>
